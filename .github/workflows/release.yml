name: release

# Push a vX.Y.Z tag to release: publish to crates.io, then cut the GitHub
# release. crates.io auth is trusted publishing (OIDC), configured on the
# crate's settings page, so no registry token lives in the repo.
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # crates.io trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Tag matches Cargo.toml version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi

      - name: Test
        run: cargo test

      # Skip the upload when this version is already on crates.io, so the
      # workflow can be re-run, and v0.1.0 (published by hand) gets a release.
      - name: Check crates.io
        id: crates
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -A "plans-tui release workflow" \
            "https://crates.io/api/v1/crates/plans-tui/${GITHUB_REF_NAME#v}")
          echo "published=$([ "$status" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.crates.outputs.published == 'false'
        id: auth

      - name: Publish to crates.io
        if: steps.crates.outputs.published == 'false'
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
